<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Psyche Avatar Lab</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Psyche Avatar Lab</p>
          <h1>Future Self Call</h1>
        </div>
        <form id="joinForm" class="call-controls">
          <button id="joinButton" type="submit">Join</button>
          <button id="leaveButton" type="button" disabled>Leave</button>
        </form>
      </header>

      <section class="call-stage">
        <article class="video-pane ai-pane">
          <div class="pane-head">
            <span>AI Future Self</span>
            <strong id="remoteTrackCount">waiting</strong>
          </div>
          <div id="remoteMedia" class="media-grid empty">AI agent is not connected</div>
        </article>

        <article class="video-pane user-pane">
          <div class="pane-head">
            <span>You</span>
            <strong id="connectionState">disconnected</strong>
          </div>
          <div id="localMedia" class="media-grid empty">Join to start camera and mic</div>
        </article>
      </section>

      <section class="setup-panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Setup</p>
            <h2>Survey & Voice</h2>
          </div>
          <span id="activeRoom">psyche-avatar-lab</span>
        </div>

        <form id="personaForm" class="setup-form">
          <input id="tokenEndpoint" type="hidden" value="/api/livekit/token" />
          <input id="roomName" type="hidden" value="psyche-avatar-lab" />
          <input id="identity" type="hidden" />
          <input id="personaProvider" type="hidden" value="azure" />
          <input id="cameraEnabled" type="hidden" value="true" />
          <input id="microphoneEnabled" type="hidden" value="true" />

          <div class="form-grid">
            <label>
              Target
              <select id="targetYear">
                <option value="10">10 years</option>
                <option value="20">20 years</option>
                <option value="30">30 years</option>
              </select>
            </label>
            <label>
              Age
              <input id="surveyAge" inputmode="numeric" placeholder="21" />
            </label>
            <label>
              MBTI
              <input id="surveyMbti" placeholder="INTJ" />
            </label>
            <label>
              Voice gender
              <select id="voiceGender">
                <option value="neutral">neutral</option>
                <option value="female">female</option>
                <option value="male">male</option>
              </select>
            </label>
          </div>

          <label>
            Values
            <input id="surveyValues" placeholder="성장, 자유, 진정성" />
          </label>
          <label>
            Goals
            <textarea id="surveyGoals" placeholder="AI 제품 만들기, 경제적 선택권 만들기"></textarea>
          </label>
          <label>
            Current concerns
            <textarea id="surveyConcerns" placeholder="커리어 방향, 꾸준함 부족, 불안"></textarea>
          </label>
          <label>
            Habits & routine
            <textarea id="surveyRoutine" placeholder="아침은 불규칙하지만 밤에는 집중이 잘 된다"></textarea>
          </label>
          <label>
            Long game
            <textarea id="surveyLongGame" placeholder="오래 지속 가능한 AI 제품을 만들고 싶다"></textarea>
          </label>

          <div class="slider-grid">
            <label>
              Ideal future
              <input id="weightIdeal" type="range" min="0" max="100" value="65" />
            </label>
            <label>
              Career focus
              <input id="weightCareer" type="range" min="0" max="100" value="70" />
            </label>
            <label>
              Directness
              <input id="weightDirect" type="range" min="0" max="100" value="45" />
            </label>
          </div>

          <button id="generatePersonaButton" type="submit">Generate persona</button>
        </form>

        <form id="voiceCloneForm" class="setup-form voice-form">
          <label>
            Voice sample
            <input id="voiceSample" name="sample" type="file" accept=".wav,.mp3,audio/wav,audio/mpeg" />
          </label>
          <div class="form-grid">
            <label>
              Clone name
              <input id="voiceCloneName" value="Psyche Future Self Voice" />
            </label>
            <label>
              Clone gender
              <select id="voiceCloneGender">
                <option value="neutral">neutral</option>
                <option value="female">female</option>
                <option value="male">male</option>
              </select>
            </label>
          </div>
          <label class="switch consent-row">
            <input id="voiceConsent" type="checkbox" />
            <span>I confirm this is my own voice sample.</span>
          </label>
          <button id="cloneVoiceButton" type="submit">Clone voice</button>
        </form>

        <div class="setup-output">
          <h2>Generated Config</h2>
          <pre id="setupOutput">No persona or voice generated yet</pre>
        </div>

        <form id="avatarDemoForm" class="setup-form avatar-demo-form">
          <h2>Avatar Preview</h2>
          <label>
            GPU worker URL
            <input id="avatarWorkerUrl" value="http://localhost:8080" />
          </label>
          <div class="form-grid">
            <label>
              Face video
              <input id="avatarFacePath" value="models/assets/face.mp4" />
            </label>
            <label>
              Reply audio
              <input id="avatarAudioPath" value="models/assets/speech-clean.wav" />
            </label>
          </div>
          <button id="generateAvatarButton" type="submit">Generate avatar reply</button>
          <div id="avatarDemoStatus" class="demo-status">GPU worker waiting</div>
        </form>

        <ol id="eventLog" class="event-log compact-log">
          <li>Waiting for call events</li>
        </ol>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
